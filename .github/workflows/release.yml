name: Release build
# Prebuilt plugin and helpers, one archive per supported Hyprland release
# (dev/release/hyprland.json), each built in an Arch container pinned to an
# Arch Linux Archive snapshot (same Hyprland package as the target). Asset
# names carry the Hyprland version. Tags v* publish one GitHub Release with
# every archive and its sha256; other pushes that change the recipe only build
# and keep the archives as workflow artifacts.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - .github/workflows/release.yml
      - dev/release/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.read.outputs.builds }}
      versions: ${{ steps.read.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          echo "builds=$(jq -c .builds dev/release/hyprland.json)" >> "$GITHUB_OUTPUT"
          echo "versions=$(jq -r '[.builds[].hyprland] | join(", ")' dev/release/hyprland.json)" >> "$GITHUB_OUTPUT"
  build:
    needs: matrix
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.builds) }}
    env:
      HYPRLAND_VERSION: ${{ matrix.hyprland }}
      ARCH_SNAPSHOT: ${{ matrix.archSnapshot }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Git for checkout (the snapshot step below pins every package)
        run: pacman -Sy --noconfirm --needed git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dependencies (Arch Linux Archive snapshot)
        run: dev/release/arch-deps.sh "$ARCH_SNAPSHOT"
      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=
          if [[ $GITHUB_REF == refs/tags/v* ]]; then version=${GITHUB_REF_NAME#v}; fi
          dev/release/build.sh dist $version
      - name: Smoke test the archive
        run: |
          mkdir smoke && tar -C smoke -xzf dist/*.tar.gz
          { smoke/hyprune-core/bin/hyprune-world-check 2>&1 || true; } | grep -q usage
          python3 -c 'import json,sys; a=json.load(open(sys.argv[1])); assert a["tag"]=="v"+sys.argv[2], a' \
            smoke/hyprune-core/abi.json "$HYPRLAND_VERSION"
          ldd smoke/hyprune-core/lib/hyprune-core.so | (! grep 'not found')
      - uses: actions/upload-artifact@v4
        with:
          name: hyprune-core-hyprland-${{ matrix.hyprland }}
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [matrix, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hyprune-core-hyprland-*
          merge-multiple: true
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONS: ${{ needs.matrix.outputs.versions }}
        run: |
          cd dist && sha256sum -c ./*.sha256
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "hyprune-core $GITHUB_REF_NAME (Hyprland $VERSIONS)" \
            --notes "Prebuilt for Hyprland $VERSIONS (Arch Linux packages, see dev/release/hyprland.json), one archive per Hyprland release: pick the one named for yours. The .sha256 and .abi.json files describe each archive; abi.json must match the running compositor." \
            ./*
