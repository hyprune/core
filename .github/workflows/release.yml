name: Release build
# Prebuilt plugin and helpers for one Hyprland ABI, built in an Arch container
# pinned to an Arch Linux Archive snapshot (same Hyprland package as the target).
# Tags v* publish a GitHub Release with the archive and its sha256; other pushes
# that change the recipe only build and keep the archive as a workflow artifact.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - .github/workflows/release.yml
      - dev/release/**
  workflow_dispatch:
permissions:
  contents: read
env:
  HYPRLAND_VERSION: 0.56.2
  ARCH_SNAPSHOT: 2026/10/10
jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Git for checkout (the snapshot step below pins every package)
        run: pacman -Sy --noconfirm --needed git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dependencies (Arch Linux Archive snapshot)
        run: dev/release/arch-deps.sh "$ARCH_SNAPSHOT"
      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=
          if [[ $GITHUB_REF == refs/tags/v* ]]; then version=${GITHUB_REF_NAME#v}; fi
          dev/release/build.sh dist $version
      - name: Smoke test the archive
        run: |
          mkdir smoke && tar -C smoke -xzf dist/*.tar.gz
          { smoke/hyprune-core/bin/hyprune-world-check 2>&1 || true; } | grep -q usage
          python3 -c 'import json,sys; a=json.load(open(sys.argv[1])); assert a["tag"]=="v"+sys.argv[2], a' \
            smoke/hyprune-core/abi.json "$HYPRLAND_VERSION"
          ldd smoke/hyprune-core/lib/hyprune-core.so | (! grep 'not found')
      - uses: actions/upload-artifact@v4
        with:
          name: hyprune-core-hyprland-${{ env.HYPRLAND_VERSION }}
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hyprune-core-hyprland-${{ env.HYPRLAND_VERSION }}
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum -c ./*.sha256
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "hyprune-core $GITHUB_REF_NAME (Hyprland $HYPRLAND_VERSION)" \
            --notes "Prebuilt for Hyprland $HYPRLAND_VERSION (Arch Linux package, snapshot $ARCH_SNAPSHOT). The .sha256 and .abi.json files describe the archive; abi.json must match the running compositor." \
            ./*
